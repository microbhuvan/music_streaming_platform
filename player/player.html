<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Melody - Player</title>

    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="player.css" />
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar">
      <a href="../home/index.html" class="logo"> ♪ <span>Melody</span> </a>

      <div class="nav-links">
        <a href="../home/index.html"> Home </a>

        <a href="../search/search.html"> Search </a>

        <a href="../playlists/playlists.html"> Playlists </a>

        <a href="../artists/artists.html"> Artists </a>

        <a href="player.html" class="active"> Player </a>
      </div>
    </nav>

    <main class="container fade-in">
      <!-- PLAYER -->

      <section class="player-section">
        <div class="album-art">
          <img
            src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=800&q=80"
            alt="Midnight Dreams album cover"
          />
        </div>

        <div class="player-info">
          <p class="playing-label">NOW PLAYING</p>

          <h1>Midnight Dreams</h1>

          <p class="artist-name">Nova Lane</p>

          <!-- PROGRESS -->

          <div class="progress-area">
            <div class="progress-bar">
              <div class="progress"></div>
            </div>

            <div class="time">
              <span>1:42</span>

              <span>3:42</span>
            </div>
          </div>

          <!-- CONTROLS -->

          <div class="controls">
            <button>↶</button>

            <button>⏮</button>

            <button class="play-button">▶</button>

            <button>⏭</button>

            <button>↷</button>
          </div>

          <!-- VOLUME -->

          <div class="volume">
            <span>🔊</span>

            <input type="range" min="0" max="100" value="70" />
          </div>
        </div>
      </section>

      <!-- UP NEXT -->

      <section class="section">
        <div class="section-heading">
          <h2>Up Next</h2>

          <a href="#"> Queue </a>
        </div>

        <div class="queue">
          <div class="queue-song">
            <span>01</span>

            <img
              src="https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=150&q=80"
              alt="Electric Soul"
            />

            <div>
              <h3>Electric Soul</h3>

              <p>Aria Stone</p>
            </div>

            <span> 4:05 </span>
          </div>

          <div class="queue-song">
            <span>02</span>

            <img
              src="https://images.unsplash.com/photo-1521337581100-8ca9a73a5f79?auto=format&fit=crop&w=150&q=80"
              alt="Golden Hour"
            />

            <div>
              <h3>Golden Hour</h3>

              <p>Leo Miles</p>
            </div>

            <span> 3:28 </span>
          </div>

          <div class="queue-song">
            <span>03</span>

            <img
              src="https://images.unsplash.com/photo-1483412033650-1015ddeb83d1?auto=format&fit=crop&w=150&q=80"
              alt="After Dark"
            />

            <div>
              <h3>After Dark</h3>

              <p>The Echoes</p>
            </div>

            <span> 3:51 </span>
          </div>

          <div class="queue-song">
            <span>04</span>

            <img
              src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=150&q=80"
              alt="City Lights"
            />

            <div>
              <h3>City Lights</h3>

              <p>Luna Ray</p>
            </div>

            <span> 4:12 </span>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->

    <footer class="footer">
      <div class="container">
        <h3>♪ Melody</h3>

        <p>Music for every moment.</p>

        <span> © 2026 Melody </span>
      </div>
    </footer>
  </body>
</html>
